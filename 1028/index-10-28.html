<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function showSeiseki() {
            var item = document.getElementById("v").value;
            // テキストボックスの中身は文字列。　文字列＋数　は文字列になる。
            // 数字の並び（＝文字列）を値に直すには、1をかける
            // alert ( item*1 + 1 );

            if (item * 1 < 44) {             // 0　～　43
                alert("grade 1");
            } else {                         // 44　～  100
                if (item * 1 < 50) {              // 44　～  49
                    alert("grade 2");
                } else {                        // 50　～  100
                    if (item * 1 < 70) {               // 50　～  69
                        alert("grade 3");
                    } else {                        // 70　～  100
                        alert("grade 4");
                    }
                }
            }

            // else { if () else () }　は、else if 文に置き換えることができる。
            if (item * 1 < 44)
                alert("grade 1");
            else if (item * 1 < 50)
                alert("grade 2");
            else if (item * 1 < 70)
                alert("grade 3");
            else
                alert("grade 4");


        }
        
        function showSeiseki2() {
            // - 2        ・・・単項演算子
            // 2 + 3      ・・・2項演算子

            var item = document.getElementById("v").value;
            //  条件式 ? Yesの結果 : Noの結果
            var ret = item * 1 < 44 ? true : false;

            // 別解　こっちで書けるのであれば、それでOK。三項演算子は読めればOK
            if (item * 1 < 44) {
                ret = true;
            } else {
                ret = false;
            }

            alert(ret);


        }
    </script>
</head>

<body>
    <input type="text" name="v" id="v">
    <button onclick="showSeiseki()"> 成績評価</button>
    <button onclick="showSeiseki2()">三項演算子で成績評価</button>

    <script>
                                    //下の省略形i++
        for (   var i = 0;  i < 10;     i = i + 1       ) {
            document.write("この一行を繰り返します。<br>");
        }

                                    //下の省略形j--
        for (   var j = 10 ;  j > 0 ;    j = j - 1 ){
            document.write( "カウントダウン型繰り返し");
        }

    </script>

</body>

</html>
