<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>
        <script>
            document.write( "私の名前は黒川です。<br>" );
            
            i=1;
            i < 10
            i = i + 1
            
            
            document.write( i + "<br>");
            i=i+1;

            for(i= 1; i <= 10; i++){
                document.write(i + "<br>");
            }

            i = 1;
            for(; i <= 10;){
                document.write(i + "<br>");
                i++;
            }

            for(i=10; i>0; i-- ){
                document.write(i + "<br>");
            }

            // countForLoop = countForLoop + 1;
            // countForLoop ++ ;
            // 変数名が長いとき、
            // １増やす・１減らすには＋＋、ーーが使われる

            // 数字の１に２を１０回掛ける
            // ０．変数ansの最初の値は１
            var ans = 1 ;
            // １．変数lpの最初の値は１
            var lp = 1 ;
            // ２．変数lpが１０以下の時は繰り返す
            for(   ;  lp <= 10  ;  lp++   ){
                // ３．変数ansを２倍にする
                ans  =  ans * 2  ;
            }
            document.write( "2^10は" + ans + "です<br>");
            // ４．変数lpを１増やす

            // 変数名のルール
            // １文字目はアルファベット、下線
            // ２文字目以降アルファベット、数字、下線
            // 大文字小文字は区別される　頭に数字を入れると違う意味になる


            プチ情報
            var a = 0x10;       //１６進数
            var a = 0o10 ;      //８進数
            var a = 0b1001 ;      //２進数       
            document.write("a: " + a );

        </script>
    </h1>
</body>

</html>
